name: Generate M3U Playlist

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests
      - name: Run script
        run: python stalker_to_m3u.py
      - name: Commit and push if changed
        id: commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add Mac_playlist.m3u
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git commit -m "Update Mac_playlist.m3u"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin ${{ github.ref_name }}
          echo "changed=true" >> $GITHUB_OUTPUT

  trigger_others:
    runs-on: ubuntu-latest
    needs: [build]
    if: needs.build.outputs.changed == 'true'
    steps:
      - name: Trigger FootOnSat_Optimize
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PAT }}
        run: |
          echo "📡 Gửi trigger đến FootOnSat_Optimize.yml..."
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token $GH_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/FootOnSat_Optimize.yml/dispatches \
            -d '{"ref":"1"}'
      - name: Trigger Football_match_live
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PAT }}
        run: |
          echo "📡 Gửi trigger đến Football_match_live.yml..."
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token $GH_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/Football_match_live.yml/dispatches \
            -d '{"ref":"1"}'
