name: STBcheck - Update IPTV Playlist

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# Cấp quyền ghi cho GITHUB_TOKEN
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}   # Sử dụng token có quyền ghi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate M3U playlist (no proxy)
        run: |
          python generate_playlist.py --no-proxy --input Mac_list.txt --output S_playlist.m3u

      - name: Commit updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add S_playlist.m3u
          git diff --staged --quiet || git commit -m "Auto-update S_playlist.m3u $(date -u +'%Y-%m-%d %H:%M')"
          git push
