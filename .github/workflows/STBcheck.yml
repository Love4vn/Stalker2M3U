name: STBcheck - Update IPTV Playlist

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate M3U playlist (no proxy)
        run: |
          python generate_playlist.py --no-proxy --max-channels 2000 --input Mac_list.txt --output S_playlist.m3u

      - name: Check if playlist was created
        id: check_file
        run: |
          if [ -f S_playlist.m3u ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit updated playlist
        if: steps.check_file.outputs.exists == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add S_playlist.m3u
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update S_playlist.m3u $(date -u +'%Y-%m-%d %H:%M')"
          git push
